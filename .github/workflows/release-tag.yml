name: Release tag

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Date for the tag (YYYY-MM-DD). Leave empty for today."
        required: false
        type: string

permissions:
  contents: write

jobs:
  create-release-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout master
        uses: actions/checkout@v6
        with:
          ref: master
          fetch-depth: 0

      - name: Determine tag name
        id: tag
        env:
          TARGET_DATE: ${{ inputs.target_date }}
        run: |
          if [ -z "$TARGET_DATE" ]; then
            DATE=$(date +'%Y-%m-%d')
          else
            DATE="$TARGET_DATE"
            if ! printf '%s' "$DATE" | grep -Eq '^[0-9]{4}-[0-9]{2}-[0-9]{2}$'; then
              echo "Error: target_date must match YYYY-MM-DD format." >&2
              exit 1
            fi
          fi

          BASE="release-${DATE}"
          git fetch --tags --force

          # First release of the day has no suffix; the 2nd becomes -2, the 3rd -3, ...
          if ! git rev-parse -q --verify "refs/tags/${BASE}" >/dev/null; then
            TAG="$BASE"
          else
            N=2
            while git rev-parse -q --verify "refs/tags/${BASE}-${N}" >/dev/null; do
              N=$((N + 1))
            done
            TAG="${BASE}-${N}"
          fi

          echo "Creating tag: $TAG"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          # Creates the tag on master AND a Release whose body is the
          # auto-generated "What's Changed" list of merged PRs.
          gh release create "$TAG" \
            --target master \
            --title "$TAG" \
            --generate-notes
          echo "Created release $TAG on $(git rev-parse --short HEAD)"
